emptyArray: []
collections:
  docs:
    output: true
  amuseum:
    output: true
  nature:
    output: true
plugins:
  - jekyll-seo-tag
title: NP-Incompleteness
description: Kunigami's Technical Blog
author: Guilherme Kunigami
url: "https://www.kuniga.me"

defaults:
  - scope:
      path: "blog"
      type: "posts"
    values:
      blog: "technical"

  - scope:
      path: "books"
      type: "posts"
    values:
      blog: "books"
      # `category` is a reserved front matter key and would otherwise be
      # injected into the URL, so pin the permalink explicitly.
      permalink: /books/:year/:month/:day/:title.html
